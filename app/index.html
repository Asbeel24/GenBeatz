<title>GenBeatz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: hardware-console look — sample library rack on the left, pattern workbench on the right; single dark theme by choice */
:root {
  color-scheme: dark;
  --bg: #121418;
  --panel: #1a1d23;
  --panel-2: #21252c;
  --line: #2d323b;
  --fg: #e8e6e1;
  --muted: #8f949d;
  --accent: #f2a93b;      /* amber LED */
  --accent-ink: #1b1306;
  --k: #f2a93b; --s: #e86a5a; --h: #6fc3d9; --o: #4f9fb8; --p: #b48ce8; --r: #e0a3c8; --b: #7ed39a;
  --warn: #e8c35a;
  --display: "Chakra Petch", "PingFang SC", "Microsoft YaHei", sans-serif;
  --body: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
input[type=checkbox] { accent-color: var(--accent); }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 14px; line-height: 1.5; }
.app { max-width: 1560px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.logo { font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: .02em; }
.logo span { color: var(--accent); }
.tag { color: var(--muted); }
.grid { display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr) minmax(0, 320px); gap: 16px; align-items: start; }
@media (max-width: 1180px) { .grid { grid-template-columns: minmax(0, 280px) minmax(0, 1fr); } .mixer { grid-column: 1 / -1; } }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.transport { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
.tgroup { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); letter-spacing: .04em; }
input.bpm { font-family: var(--display); font-size: 26px; font-weight: 700; width: 92px; text-align: center; color: var(--accent); background: #0d0f12; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; cursor: ns-resize; font-variant-numeric: tabular-nums; }
.transport select, .transport input[type=number]:not(.bpm) { height: 34px; }
.transport .sep { width: 1px; align-self: stretch; background: var(--line); }
button.play { width: 46px; height: 40px; font-size: 18px; padding: 0; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { font-family: var(--display); font-variant-numeric: tabular-nums; min-width: 42px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.ws-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.modes { display: flex; gap: 4px; }
.modes button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.mixer .strip { display: grid; grid-template-columns: 62px 26px 26px minmax(0, 1fr) 44px; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.mixer .strip.sel { border-color: var(--line); background: var(--panel-2); }
.mixer .strip .nm { font-family: var(--mono); font-size: 12px; }
.mixer .strip .db { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.mixer .ms { width: 26px; height: 22px; padding: 0; font-size: 11px; font-family: var(--mono); }
.mixer .ms.on.m { background: #5a2b26; border-color: var(--s); color: #fff; }
.mixer .ms.on.s { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mixer input[type=range] { width: 100%; accent-color: var(--accent); }
.meter { grid-column: 1 / -1; height: 3px; background: #252a31; border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--b); }
.eq { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; display: grid; grid-template-columns: 72px minmax(0, 1fr) 52px; gap: 6px 8px; align-items: center; font-size: 12px; }
.eq .db { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: right; }
.soon { font-size: 11px; color: var(--muted); }
.knobs { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
.knob { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 70px; cursor: ns-resize; user-select: none; touch-action: none; border-radius: 8px; padding: 2px 0; }
.knob:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dial { --p: .5; width: 42px; height: 42px; border-radius: 50%; position: relative; background: conic-gradient(from 225deg, var(--accent) 0 calc(var(--p) * 270deg), #2d323b calc(var(--p) * 270deg) 270deg, transparent 270deg); }
.dial::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line); }
.dial::before { content: ""; position: absolute; left: calc(50% - 1px); top: 7px; width: 2px; height: 12px; background: var(--fg); border-radius: 1px; z-index: 1; transform-origin: 1px 14px; transform: rotate(calc(-135deg + var(--p) * 270deg)); }
.klab { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.kval { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.panel h2 { font-family: var(--display); font-size: 15px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 12px; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button, .btn { font: inherit; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: #4a515d; }
button:focus-visible, input:focus-visible, select:focus-visible, label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.primary:hover { filter: brightness(1.08); }
button.big { font-family: var(--display); font-size: 17px; padding: 10px 20px; letter-spacing: .04em; }
button.small { padding: 3px 8px; font-size: 12px; }
button.on { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
input[type=number], input[type=search], select { font: inherit; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
input[type=number] { width: 80px; font-family: var(--mono); }
.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.drop { border: 1px dashed #47505c; border-radius: 8px; padding: 14px; text-align: center; color: var(--muted); }
.drop.over { border-color: var(--accent); color: var(--fg); }
.summary { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.packs { display: flex; flex-direction: column; gap: 6px; max-height: 60vh; overflow: auto; }
.pack { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.pack-head { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; }
.pack-head input { margin-top: 4px; accent-color: var(--accent); }
.pack-name { font-weight: 600; word-break: break-word; }
.counts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #2a2f37; color: var(--muted); white-space: nowrap; }
.chip.warn { color: var(--warn); }
.pack-body { padding: 0 10px 10px 34px; font-size: 12px; }
.cat-title { color: var(--muted); margin-top: 6px; font-family: var(--mono); }
.sample { display: block; width: 100%; text-align: left; background: none; border: none; padding: 2px 0; color: var(--fg); word-break: break-all; font-size: 12px; }
.sample:hover { color: var(--accent); }
.expand { margin-left: auto; background: none; border: none; color: var(--muted); padding: 0 4px; }
.params-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.hint { font-size: 12px; color: var(--muted); }
.results-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 20px 0 12px; }
.results-head h2 { margin: 0; font-family: var(--display); font-size: 18px; }
.cards { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.playing { border-color: var(--accent); }
.card-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.num { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--accent); font-variant-numeric: tabular-nums; }
.title { font-family: var(--display); font-weight: 600; font-size: 16px; }
.meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.spacer { flex: 1; }
.progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); }
.steps-wrap { overflow-x: auto; }
.steps { display: grid; gap: 2px; }
.steps .lab { font-family: var(--mono); font-size: 10px; color: var(--muted); align-self: center; }
.steps .c { height: 12px; border-radius: 2px; background: #252a31; }
.steps.edit .c { height: 16px; cursor: pointer; touch-action: none; }
.steps.edit .c:hover { outline: 1px solid var(--accent); outline-offset: -1px; }
.steps.edit .c.ph { background: rgba(242,169,59,.38); }
.steps.edit .c.on.ph, .steps.edit .c.roll.ph { opacity: 1 !important; filter: brightness(1.45); box-shadow: 0 0 8px var(--col); }
.arr-wrap { position: relative; overflow-x: auto; }
.arr-inner { position: relative; min-width: 640px; } /* the playhead measures against the full grid width, also when it scrolls */
.arr-grid { display: grid; gap: 3px 0; }
.arr-grid .lab { font-family: var(--mono); font-size: 10px; color: var(--muted); align-self: center; }
.arr-grid .sec { all: unset; cursor: pointer; font-family: var(--mono); font-size: 11px; padding: 4px 6px; margin-right: 3px; border-radius: 4px; background: color-mix(in srgb, var(--sc) 22%, transparent); color: var(--sc); border-left: 3px solid var(--sc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.arr-grid .sec:hover { background: color-mix(in srgb, var(--sc) 35%, transparent); }
.arr-grid .blk { all: unset; cursor: pointer; height: 20px; margin-right: 3px; border-radius: 3px; background: #252a31; }
.arr-grid .blk.on { background: var(--col); opacity: .85; }
.arr-grid .blk:hover { outline: 1px solid var(--accent); outline-offset: -1px; }
.arr-grid .blk:focus-visible, .arr-grid .sec:focus-visible { outline: 2px solid var(--accent); }
.arr-ph { --x: 0; position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 6px var(--accent); left: calc(74px + (100% - 74px) * var(--x)); pointer-events: none; display: none; }
#work.playing .arr-ph { display: block; }
.gridbar select { width: auto; max-width: 320px; }
.pick-ov { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.picker { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(720px, 100%); max-height: min(640px, 90vh); display: flex; flex-direction: column; gap: 10px; padding: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.pick-head, .pick-ctl, .pick-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pick-ctl input[type=search] { flex: 1; min-width: 180px; }
.pick-ctl select { width: auto; }
.pick-list { overflow-y: auto; flex: 1; min-height: 200px; border: 1px solid var(--line); border-radius: 6px; }
.pick-row { all: unset; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 10px; width: 100%; padding: 7px 10px; cursor: pointer; border-bottom: 1px solid var(--line); font-size: 13px; }
.pick-row:hover { background: var(--panel-2); }
.pick-row.sel { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.pick-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.pick-row .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-row .pp, .pick-row .pt { color: var(--muted); font-family: var(--mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-row.cur .pn::after { content: ' ●'; color: var(--accent); }
.gridbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 6px; }
.gridbar .gstat { margin-left: 4px; font-size: 11px; }
.steps .c.beat { background: #2c323a; }
.steps .c.on { background: var(--col); }
.steps .c.soft { background: var(--col); opacity: .45; }
.steps .c.roll { background: repeating-linear-gradient(90deg, var(--col) 0 2px, transparent 2px 4px); }
.slots { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-size: 13px; }
.slot-lab { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.slot-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot-name .pk { color: var(--muted); }
.slot-btns { display: flex; gap: 4px; }
.warnline { font-size: 12px; color: var(--warn); }
.empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--panel-2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; z-index: 20; max-width: calc(100% - 32px); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="transport" aria-label="项目控制">
    <div class="logo" style="align-self:center">Gen<span>Beatz</span></div>
    <span class="sep"></span>
    <label class="tgroup">BPM<input id="bpmInput" class="bpm" type="number" min="60" max="200" value="140" title="点击输入，滚轮或上下拖动调整"></label>
    <label class="tgroup">曲风<select id="genreSel"></select></label>
    <label class="tgroup">调性<select id="keySel"></select></label>
    <div class="tgroup">长度<div id="lenSeg" class="seg"><button aria-pressed="true" data-v="loop">Loop · 8 小节</button><button data-v="song" aria-pressed="false">全曲</button></div></div>
    <label class="tgroup">数量<input id="countInput" type="number" min="1" max="20" value="6"></label>
    <label class="tgroup">鼓的搭配<select id="modeSel"><option value="pack">同包优先</option><option value="mix">跨包混搭</option></select></label>
    <span class="sep"></span>
    <button id="genBtn" class="primary big">生成</button>
    <button id="playBtn" class="primary play playbtn" title="播放 / 停止（空格）" aria-label="播放">▶</button>
    <span class="sep"></span>
    <div class="tgroup">导出
      <div class="row" style="gap:10px">
        <label class="check"><input id="fmtWav" type="checkbox" checked> WAV</label>
        <label class="check"><input id="fmtMp3" type="checkbox" checked> MP3</label>
        <label class="check"><input id="fmtStems" type="checkbox" checked> 分轨</label>
        <button id="exportOne">导出当前</button>
        <button id="exportAll">全部导出</button>
      </div>
    </div>
  </header>
  <div id="genInfo" class="hint" style="margin:-8px 0 12px"></div>

  <main class="grid">
    <section class="panel stack" aria-label="采样库">
      <h2>采样库</h2>
      <div class="row">
        <label class="btn" for="dirInput">选择采样库文件夹</label>
        <input id="dirInput" class="vh" type="file" webkitdirectory directory multiple>
        <button id="allOn" class="small">全选</button>
        <button id="allOff" class="small">全不选</button>
      </div>
      <div id="drop" class="drop">也可以把文件夹直接拖到这里<br><span class="hint">一级子文件夹 = 一个采样包，只读文件名，音频不会上传</span></div>
      <div id="summary" class="summary"></div>
      <div id="packs" class="packs"></div>
    </section>

    <section id="work" class="panel stack" aria-label="工作台" style="min-width:0">
      <div class="ws-top">
        <div id="tabs" class="tabs" role="tablist" aria-label="demo"></div>
        <div class="modes" id="viewSeg"><button aria-pressed="true" data-v="pattern">Pattern</button><button aria-pressed="false" data-v="arrange">Arrange</button></div>
      </div>
      <div id="ws"></div>
    </section>

    <section class="panel mixer" aria-label="混音台">
      <h2>混音台</h2>
      <div id="strips"></div>
      <div id="eq" class="eq"></div>
      <div class="row" style="margin-top:10px"><label class="check"><input id="tuneChk" type="checkbox"> 808 跟随 loop 调性</label></div>
      <div class="row" style="margin-top:6px"><button id="mixReset" class="small">全部归零</button><span class="soon">设置对试听和导出都生效</span></div>
    </section>
  </main>
</div>
<div id="toast" class="toast" hidden></div>

<script>

const $ = (s, el = document) => el.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);

// ---------- categories & filename parsing
const CAT_LABEL = { kick: 'Kick', snare: 'Snare', clap: 'Clap', hat: 'Hi-hat', ohat: 'Open hat', perc: 'Perc', rim: 'Rim', bass808: '808', loop: '旋律 Loop', fx: 'FX', drumloop: '鼓 Loop', other: '未分类' };

  ['ohat', /\b(open ?hats?|open ?hh|ohh?|openhats?)\b/],
  ['hat', /\b(hi ?hats?|hihats?|hh|chh|closed ?hats?|hats?)\b/],

const LOOPY = /\b(loops?|melody|melodies|melodic|mel|samples? ?loops?)\b/;
const DRUMLOOP = /\b(drums? ?loops?|drums?|breaks?|tops?|beat)\b/;
const CATDIR = /^(\d+ )?(kicks?|snares?|claps?|hi ?hats?|hats?|open ?hats?|hh|oh|percs?|percussion|808 ?s?|bass|subs?|fx|sfx|loops?|melod(y|ies)|drums?|drum ?loops?|one ?shots?|samples?|midi|stems?|vox|vocals?|cymbals?|crash(es)?|rims?|toms?|snaps?|shakers?|risers?|impacts?)( \d+)?$/;
const AUDIO_EXT = /\.(wav|mp3|aif|aiff|flac|ogg|m4a)$/i;
function norm(s) {
  return s.replace(AUDIO_EXT, '').toLowerCase()
    .replace(/[_\-.()\[\]{},+&~]+/g, ' ')
    .replace(/(\d)([a-z])/g, '$1 $2').replace(/([a-z])(\d)/g, '$1 $2')
    .replace(/\s+/g, ' ').trim();
}
function matchCat(n) { for (const [c, re] of RULES) if (re.test(n)) return c; return null; }
function parseBpm(n, loopish) {
  let m = n.match(/\b(\d{2,3}) ?bpm\b/) || n.match(/\bbpm ?(\d{2,3})\b/);
  if (m) { const v = +m[1]; if (v >= 50 && v <= 220) return v; }
  if (loopish) for (const t of n.split(' ')) { if (/^\d{2,3}$/.test(t)) { const v = +t; if (v >= 60 && v <= 200) return v; } }
  return null;
}
const NOTE = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
const NOTE_NAMES = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
function parseKey(fname, allowBare) {
  const toks = fname.replace(AUDIO_EXT, '').replace(/[_\-.()\[\]{},+&~]+/g, ' ').split(/\s+/).filter(Boolean);
  for (let i = 0; i < toks.length; i++) {
    const m = toks[i].match(/^([A-Ga-g])(#|♯|b|♭)?(m|min|minor|maj|major|mi)?$/);
    if (!m) continue;
    let acc = m[2] || '', mode = m[3] ? m[3].toLowerCase() : '';
    if (!acc && !mode) {
      const nx = (toks[i + 1] || '').toLowerCase();
      if (['minor', 'min', 'major', 'maj'].includes(nx)) mode = nx;
      else if (!(allowBare && /[A-G]/.test(m[1]))) continue;
    }
    let root = NOTE[m[1].toLowerCase()];
    if (acc === '#' || acc === '♯') root += 1; else if (acc === 'b' || acc === '♭') root -= 1;
    root = (root + 12) % 12;
    const md = mode ? (mode.startsWith('maj') ? 'maj' : 'min') : null;
    return { root, mode: md };
  }
  return null;
}
const keyLabel = k => k ? NOTE_NAMES[k.root] + (k.mode === 'min' ? 'm' : k.mode === 'maj' ? '' : '') : '';
const keyText = k => k ? NOTE_NAMES[k.root] + (k.mode === 'min' ? ' minor' : k.mode === 'maj' ? ' major' : '') : '';

function classifyPath(innerParts, packName) { // folders inside the pack + filename
  const fname = innerParts[innerParts.length - 1];
  const n = norm(fname);
  const folders = innerParts.slice(0, -1).map(norm).reverse();
  const bpm0 = parseBpm(n, false);
  const fileCat = matchCat(n);
  // a loop does not have to say "loop": a BPM number plus a key in the name, a Loops / Melodies folder, or a pack called "… Loops" is enough
  const keyAndTempo = !fileCat && !!parseKey(fname, false) && parseBpm(n, true) != null;
  const loopDir = folders.some(f => LOOPY.test(f)) || (!fileCat && !folders.length && packName && LOOPY.test(norm(packName)));
  const loopish = LOOPY.test(n) || loopDir || bpm0 != null || keyAndTempo;
  let cat;
  if (loopish) {
    if (DRUMLOOP.test(n) || folders.some(f => /\bdrum ?loops?\b/.test(f)) || ['kick', 'snare', 'clap', 'hat', 'ohat', 'perc', 'rim'].includes(fileCat)) cat = 'drumloop';
    else if (fileCat === 'fx') cat = 'fx';
    else if (fileCat === 'bass808') cat = 'other';
    else cat = 'loop';
  } else {
    cat = fileCat;
    if (!cat) for (const f of folders) { cat = matchCat(f); if (cat) break; }
    if (!cat) cat = 'other';
  }
  const bpm = cat === 'loop' || cat === 'drumloop' ? parseBpm(n, true) : null;
  let key = parseKey(fname, cat === 'bass808');
  if (!key && cat === 'loop') { const pf = innerParts[innerParts.length - 2]; if (pf) key = parseKey(pf, false); }
  return { cat, bpm, key };
}

// ---------- library
const lib = { samples: [], packs: new Map() };
let sid = 0;
function packCountsText(p) { return p.counts; }
function addPackSample(packName, s) {
  if (!lib.packs.has(packName)) lib.packs.set(packName, { name: packName, samples: [], counts: {}, enabled: true, builtin: !!s.builtin });
  const p = lib.packs.get(packName);
  s.pack = packName; s.id = 's' + (sid++);
  p.samples.push(s); p.counts[s.cat] = (p.counts[s.cat] || 0) + 1;
  lib.samples.push(s);
}
function importFiles(items) { // items: [{file, path}]
  const audio = items.filter(it => AUDIO_EXT.test(it.path) && !/(^|\/)\._/.test(it.path) && !/__MACOSX/.test(it.path));
  if (!audio.length) { toast('这个文件夹里没有找到音频文件（wav / mp3 / aif / flac）'); return; }
  const split = audio.map(it => ({ ...it, parts: it.path.split('/').filter(Boolean) }));
  // decide whether the chosen folder is a library (children = packs) or a single pack (children = categories)
  const kids = new Set(split.filter(x => x.parts.length >= 3).map(x => x.parts[1]));
  const catLike = [...kids].filter(k => CATDIR.test(norm(k))).length;
  const singlePack = kids.size === 0 || catLike / kids.size > 0.5;
  // drop previous user library, keep built-in pack but switch it off
  lib.samples = lib.samples.filter(s => s.builtin);
  for (const [k, p] of lib.packs) if (!p.builtin) lib.packs.delete(k); else p.enabled = false;
  const off = new Set(store.get('gb.packsOff', []));
  for (const x of split) {
    let pack, inner;
    if (singlePack || x.parts.length < 3) { pack = x.parts.length > 1 ? x.parts[0] : '未命名'; inner = x.parts.slice(1); }
    else { pack = x.parts[1]; inner = x.parts.slice(2); }
    if (!inner.length) inner = [x.parts[x.parts.length - 1]];
    const c = classifyPath(inner, pack);
    addPackSample(pack, { file: x.file, path: x.path, name: x.parts[x.parts.length - 1], ...c });
  }
  for (const [k, p] of lib.packs) if (!p.builtin) p.enabled = !off.has(k);
  renderLibrary();
  guessLoopTempos();
  const n = lib.samples.filter(s => !s.builtin).length;
  toast(`已导入 ${n} 个音频文件，${[...lib.packs.values()].filter(p => !p.builtin).length} 个采样包`);
}

// loops with no BPM in the name: read the length and work out the tempo (1/2/4/8/16 bars of 4/4; ×2 and ÷2 are matched later anyway)
async function guessLoopTempos() {
  const todo = lib.samples.filter(s => s.cat === 'loop' && !s.bpm && s.file);
  if (!todo.length) return;
  let found = 0;
  for (const s of todo) {
    try {
      const ab = await s.file.arrayBuffer();
      const buf = await new OfflineAudioContext(1, 1, SR).decodeAudioData(ab);
      const dur = buf.duration; let best = null;
      for (const bars of [1, 2, 4, 8, 16]) {
        const bpm = bars * 240 / dur;
        if (bpm < 70 || bpm > 180) continue;
        const err = Math.abs(bpm - Math.round(bpm));
        const score = err + (bpm >= 85 && bpm <= 175 ? 0 : 0.2); // same tempo at ×2 / ÷2: prefer the usual 85–175 range
        if (!best || score < best.score) best = { bpm: Math.round(bpm), err, score };
      }
      if (best && best.err < 0.35) { s.bpm = best.bpm; s.bpmGuess = true; found++; }
    } catch (e) { /* undecodable: leave it without a tempo */ }
  }
  if (found) { renderLibrary(); toast(`${found} 个没写 BPM 的 loop 已按长度算出速度`); }
}
// decoding (lazy, cached, peak-normalized)
const decodeCache = new Map();
function getBuffer(s) {
  if (!s) return Promise.resolve(null);
  if (!decodeCache.has(s.id)) {
    decodeCache.set(s.id, (async () => {
      try {
        let buf;
        if (s.gen) buf = await s.gen();
        else {
          const ab = await s.file.arrayBuffer();
          const ctx = new OfflineAudioContext(2, 1, SR);
          buf = await ctx.decodeAudioData(ab);
        }
        let peak = 0;
        for (let c = 0; c < buf.numberOfChannels; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i += 2) { const a = Math.abs(d[i]); if (a > peak) peak = a; } }
        return { buffer: buf, norm: peak > 0.0001 ? Math.min(4, (s.cat === 'loop' ? 0.9 : 1) / peak) : 1 };
      } catch (e) { s.bad = true; return null; }
    })());
  }
  return decodeCache.get(s.id);
}

// ---------- built-in demo kit (synthesized, so the tool works before you load a library)
function noise(ctx, dur, seed) { const r = mulberry32(seed); const b = ctx.createBuffer(1, Math.ceil(dur * SR), SR); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; return b; }
function synth(dur, build) { const ctx = new OfflineAudioContext(1, Math.ceil(dur * SR), SR); build(ctx); return ctx.startRendering(); }
function envGain(ctx, peak, t0, decay) { const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t0 + decay); return g; }
const SYN = {
  kick: (f0, f1, decay) => synth(decay + 0.05, ctx => {
    const o = ctx.createOscillator(); o.frequency.setValueAtTime(f0, 0); o.frequency.exponentialRampToValueAtTime(f1, 0.12);
    const g = envGain(ctx, 1, 0, decay); o.connect(g).connect(ctx.destination); o.start(0);
  }),
  snare: (tone, decay) => synth(decay + 0.05, ctx => {
    const n = ctx.createBufferSource(); n.buffer = noise(ctx, decay, 7); const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 0.7;
    n.connect(bp).connect(envGain(ctx, 0.9, 0, decay)).connect(ctx.destination); n.start(0);
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = tone; o.connect(envGain(ctx, 0.6, 0, 0.1)).connect(ctx.destination); o.start(0);
  }),
  clap: () => synth(0.3, ctx => {
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1300; bp.Q.value = 1.2; bp.connect(ctx.destination);
    [0, 0.011, 0.022].forEach((t, i) => { const n = ctx.createBufferSource(); n.buffer = noise(ctx, 0.3, 11 + i); n.connect(envGain(ctx, 1, t, i === 2 ? 0.22 : 0.012)).connect(bp); n.start(t); });
  }),
  hat: (decay, f) => synth(decay + 0.03, ctx => {
    const n = ctx.createBufferSource(); n.buffer = noise(ctx, decay + 0.03, 3); const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = f;
    n.connect(hp).connect(envGain(ctx, 0.8, 0, decay)).connect(ctx.destination); n.start(0);
  }),
  rim: () => synth(0.08, ctx => {
    const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = 1700; o.connect(envGain(ctx, 0.5, 0, 0.03)).connect(ctx.destination); o.start(0);
    const n = ctx.createBufferSource(); n.buffer = noise(ctx, 0.08, 5); n.connect(envGain(ctx, 0.4, 0, 0.02)).connect(ctx.destination); n.start(0);
  }),
  shaker: () => synth(0.09, ctx => {
    const n = ctx.createBufferSource(); n.buffer = noise(ctx, 0.09, 9); const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 6000; bp.Q.value = 0.8;
    n.connect(bp).connect(envGain(ctx, 0.7, 0.008, 0.05)).connect(ctx.destination); n.start(0);
  }),
  b808: () => synth(1.8, ctx => {
    const o = ctx.createOscillator(); o.frequency.setValueAtTime(130.8, 0); o.frequency.exponentialRampToValueAtTime(65.41, 0.04);
    const ws = ctx.createWaveShaper(); const curve = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; curve[i] = Math.tanh(2.2 * x); } ws.curve = curve;
    o.connect(envGain(ctx, 1, 0, 1.7)).connect(ws).connect(ctx.destination); o.start(0);
  }),
  keys: (bpm) => { const beat = 60 / bpm, dur = beat * 16; return synth(dur, ctx => {
    const chords = [[60, 63, 67], [56, 60, 63], [63, 67, 70], [58, 62, 65]];
    const hz = m => 440 * Math.pow(2, (m - 69) / 12);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; const out = ctx.createGain(); out.gain.value = 0.5; lp.connect(out).connect(ctx.destination);
    chords.forEach((ch, bar) => {
      const t0 = bar * beat * 4;
      ch.forEach(m => { const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = hz(m - 12); const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.09, t0 + 0.08); g.gain.setValueAtTime(0.09, t0 + beat * 4 - 0.05); g.gain.linearRampToValueAtTime(0.0001, t0 + beat * 4); o.connect(g).connect(lp); o.start(t0); o.stop(t0 + beat * 4); });
      const arp = [0, 1, 2, 1, 0, 2, 1, 2];
      arp.forEach((ix, j) => { const t = t0 + j * beat / 2; const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(ch[ix] + 12 * (j % 4 === 3 ? 1 : 0)); const g = envGain(ctx, 0.22, t, 0.32); o.connect(g).connect(lp); o.start(t); o.stop(t + 0.35); });
    });
  }); }
};
